name: GitHub Trending Daily
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run crawler & push
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup

          skey = "${SERVERCHAN_SENDKEY}"
          if not skey:
              print("❌ SERVERCHAN_SENDKEY 为空！")
              exit(1)

          url = "https://github.com/trending?since=daily"
          headers = {"User-Agent":"Mozilla/5.0"}
          r = requests.get(url, headers=headers, timeout=20)
          soup = BeautifulSoup(r.text, "html.parser")
          items = soup.select("article.Box-row")[:5]

          lines = []
          for it in items:
            a = it.select_one("h2 a")
            repo = a.get_text(strip=True).replace("\n","")
            link = "https://github.com" + a["href"]
            desc = it.select_one("p")
            desc = desc.get_text(strip=True) if desc else ""
            lines.append(f"- [{repo}]({link})\n  {desc}")

          content = "\n".join(lines)
          payload = {
              "title": "🔥 GitHub Trending 今日热门",
              "desp": content
          }
          api = f"https://sctapi.ftqq.com/{skey}.send"
          res = requests.post(api, data=payload)
          print("ServerChan Response:", res.text)
          PY
