name: GitHub Trending Daily
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Fetch trending & push
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
        run: |
          python << 'PY'
          import requests
          from bs4 import BeautifulSoup

          sendkey = "${SENDKEY}"
          url = "https://github.com/trending?since=daily"
          headers = {"User-Agent": "Mozilla/5.0"}
          resp = requests.get(url, headers=headers, timeout=20)
          soup = BeautifulSoup(resp.text, "html.parser")
          repos = soup.select("article.Box-row")[:5]

          lines = []
          for r in repos:
            title_tag = r.select_one("h2 a")
            repo = title_tag.get_text(strip=True).replace(" ", "")
            link = "https://github.com/" + repo
            desc_tag = r.select_one("p.col-9")
            desc = desc_tag.get_text(strip=True) if desc_tag else "无简介"
            star_tag = r.select_one("span.d-inline-block.float-sm-right")
            star = star_tag.get_text(strip=True) if star_tag else "-"
            lines.append(f"**{repo}** ⭐ +{star}\n{desc}\n{link}\n")

          content = "\n".join(lines)
          payload = {
              "title": "🔥 GitHub 今日热门",
              "desp": content
          }
          requests.post(f"https://sctapi.ftqq.com/{sendkey}.send", data=payload)
          PY
