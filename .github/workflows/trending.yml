name: GitHub Trending Daily
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip packages
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run crawler & push
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup

          key = "${SERVERCHAN_SENDKEY}"
          print("Got key:", key)
          if not key or key == "":
              print("❌ SendKey 为空！")
              exit(1)

          url = "https://github.com/trending?since=daily"
          headers = {"User-Agent": "Mozilla/5.0"}
          r = requests.get(url, headers=headers, timeout=20)
          soup = BeautifulSoup(r.text, "html.parser")
          items = soup.select("article.Box-row")[:10]

          lines = []
          for it in items:
            a = it.select_one("h2 a")
            repo = a.get_text(strip=True).replace("\n", "")
            link = "https://github.com" + a["href"]
            desc = it.select_one("p")
            desc = desc.get_text(strip=True) if desc else ""
            lines.append(f"- [{repo}]({link})\n  {desc}")

          content = "🔥 GitHub Trending 今日热门\n\n" + "\n".join(lines)
          api_url = f"https://sctapi.ftqq.com/{key}.send"
          payload = {
              "title": "GitHub Trending",
              "desp": content
          }
          res = requests.post(api_url, data=payload)
          print("ServerChan Response:", res.text)
          PY
